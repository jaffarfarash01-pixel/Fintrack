<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinTrack — Login</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0d0f;
    --panel: #111418;
    --border: #1e2428;
    --accent: #c8f24e;
    --accent-dim: rgba(200,242,78,0.12);
    --text: #e8eaec;
    --muted: #5a6370;
    --danger: #ff5f5f;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Grid background */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(200,242,78,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(200,242,78,0.03) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
  }

  /* Glow blob */
  .blob {
    position: fixed;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(200,242,78,0.08) 0%, transparent 70%);
    border-radius: 50%;
    top: -100px; right: -100px;
    pointer-events: none;
    animation: drift 8s ease-in-out infinite alternate;
  }

  @keyframes drift {
    from { transform: translate(0, 0); }
    to { transform: translate(-40px, 60px); }
  }

  .wrapper {
    display: grid;
    grid-template-columns: 1fr 420px;
    width: min(900px, 95vw);
    min-height: 540px;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    animation: fadeUp 0.6s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Left panel */
  .left {
    background: linear-gradient(135deg, #0d1117 0%, #111a10 100%);
    padding: 56px 48px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border-right: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }

  .left::after {
    content: '';
    position: absolute;
    bottom: -80px; left: -80px;
    width: 280px; height: 280px;
    background: radial-gradient(circle, rgba(200,242,78,0.1) 0%, transparent 70%);
    pointer-events: none;
  }

  .brand {
    display: flex; align-items: center; gap: 12px;
  }

  .brand-icon {
    width: 36px; height: 36px;
    background: var(--accent);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }

  .brand-name {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  .tagline {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(28px, 3vw, 38px);
    line-height: 1.15;
    color: var(--text);
    font-style: italic;
  }

  .tagline em {
    color: var(--accent);
    font-style: normal;
  }

  .stats {
    display: flex; flex-direction: column; gap: 16px;
  }

  .stat {
    display: flex; align-items: center; gap: 12px;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .stat-dot {
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* Right panel */
  .right {
    background: var(--panel);
    padding: 48px 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .form-header {
    margin-bottom: 32px;
  }

  .form-header h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 26px;
    font-weight: 400;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
  }

  .form-header p {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  .field {
    margin-bottom: 18px;
  }

  label {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 8px;
  }

  input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 12px 14px;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    letter-spacing: 0.02em;
  }

  input::placeholder { color: var(--muted); }

  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }

  .field-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .field-row label { margin-bottom: 0; }

  .forgot {
    font-size: 10px;
    color: var(--accent);
    text-decoration: none;
    letter-spacing: 0.05em;
    opacity: 0.8;
    transition: opacity 0.2s;
  }
  .forgot:hover { opacity: 1; }

  .checkbox-row {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 24px;
    font-size: 11px;
    color: var(--muted);
    cursor: pointer;
  }

  .checkbox-row input[type="checkbox"] {
    width: 14px; height: 14px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .btn-primary {
    width: 100%;
    background: var(--accent);
    color: #0a0d0f;
    border: none;
    border-radius: 3px;
    padding: 13px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
    position: relative;
    overflow: hidden;
  }

  .btn-primary::after {
    content: '';
    position: absolute; inset: 0;
    background: white;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .btn-primary:hover {
    background: #d8ff5e;
    box-shadow: 0 0 20px rgba(200,242,78,0.3);
  }

  .btn-primary:hover::after { opacity: 0.05; }
  .btn-primary:active { transform: scale(0.99); }

  .divider {
    display: flex; align-items: center; gap: 12px;
    margin: 22px 0;
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .divider::before, .divider::after {
    content: ''; flex: 1;
    height: 1px; background: var(--border);
  }

  .btn-secondary {
    width: 100%;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 12px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: border-color 0.2s, color 0.2s;
  }

  .btn-secondary:hover {
    border-color: var(--muted);
    color: var(--text);
  }

  .signup-row {
    text-align: center;
    margin-top: 24px;
    font-size: 11px;
    color: var(--muted);
  }

  .signup-row a {
    color: var(--accent);
    text-decoration: none;
    transition: opacity 0.2s;
  }
  .signup-row a:hover { opacity: 0.7; }

  /* Responsive */
  @media (max-width: 640px) {
    .wrapper { grid-template-columns: 1fr; }
    .left { display: none; }
    .right { padding: 40px 28px; }
  }
</style>
</head>
<body>

<div class="blob"></div>

<div class="wrapper">
  <!-- Left branding panel -->
  <div class="left">
    <div class="brand">
      <div class="brand-icon">₿</div>
      <span class="brand-name">FinTrack</span>
    </div>

    <div class="tagline">
      Your money,<br>
      <em>fully</em> under<br>
      control.
    </div>

    <div class="stats">
      <div class="stat">
        <span class="stat-dot"></span>
        Real-time portfolio tracking
      </div>
      <div class="stat">
        <span class="stat-dot"></span>
        Smart budget forecasting
      </div>
      <div class="stat">
        <span class="stat-dot"></span>
        256-bit AES encryption
      </div>
    </div>
  </div>

  <!-- Login form -->
  <div class="right">
    <div class="form-header">
      <h2>Welcome back</h2>
      <p>Sign in to your FinTrack account</p>
    </div>

    <form onsubmit="handleSubmit(event)">
      <div class="field">
        <label>Email address</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
      </div>

      <div class="field">
        <div class="field-row">
          <label>Password</label>
          <a href="#" class="forgot">Forgot password?</a>
        </div>
        <input type="password" id="password" placeholder="••••••••••••" autocomplete="current-password" required>
      </div>

      <label class="checkbox-row">
        <input type="checkbox" id="remember"> Keep me signed in for 30 days
      </label>

      <button type="submit" class="btn-primary" id="loginBtn">
        Sign in to FinTrack
      </button>
    </form>

    <div class="divider">or</div>

    <button class="btn-secondary" onclick="return false;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

    <div class="signup-row">
      No account yet? <a href="#">Create one free</a>
    </div>
  </div>
</div>

<script>
  function handleSubmit(e) {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    btn.textContent = 'Authenticating...';
    btn.style.opacity = '0.7';
    btn.disabled = true;
    setTimeout(() => {
      btn.textContent = '✓ Signed in';
      btn.style.background = '#4caf50';
      btn.style.opacity = '1';
    }, 1500);
  }
</script>

</body>
</html>
